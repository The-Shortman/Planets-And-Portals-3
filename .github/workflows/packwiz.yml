name: 🔨 Build with packwiz
run-name: "Build #${{ github.run_number }}"
on:
  workflow_dispatch:
    inputs:
      client_artifacts:
        description: 🖥️ Upload client artifacts
        required: true
        default: "false"
      server_artifact:
        description: 🗃️ Upload server artifacts
        required: true
        default: "false"
  push:
    branches: ["dev", "main"]

jobs:
  build:
    name: 📦 Build pack artifacts
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'The-Shortman' }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup jdk 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"

      - name: 📥 Get latest packwiz binary
        id: download-packwiz
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: go.yml
          branch: main
          name: Linux 64-bit x86
          repo: packwiz/packwiz

      - name: 🔧 Make packwiz binary executable
        shell: bash
        run: chmod +x ./packwiz

      - name: 📥 Restore cached mod downloads
        id: cache-mods-restore
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/packwiz/cache
          key: cached-mods
          restore-keys: |
            cached-mods-

      - name: 📝 Construct version string
        id: construct-base-name
        shell: bash
        run: |
          VERSION_NUMBER="$(echo "$(<pack.toml)" | grep "version =" | cut -d '"' -f 2)"
          echo "PP3_CF_NAME=Planets-And-Portals-3-CurseForge-$VERSION_NUMBER-${{github.run_number}}" >> "$GITHUB_OUTPUT"
          echo "PP3_SERVER_NAME=Planets-And-Portals-3-Server-$VERSION_NUMBER-${{github.run_number}}" >> "$GITHUB_OUTPUT"

      - name: ⚙️ Get game versions
        id: get-game-versions
        shell: bash
        run: |
          echo MINECRAFT_VERSION="$(echo "$(<pack.toml)" | grep "forge =" | cut -d '"' -f 2)" >> "$GITHUB_OUTPUT"
          echo FORGE_VERSION="$(echo "$(<pack.toml)" | grep "minecraft =" | cut -d '"' -f 2)" >> "$GITHUB_OUTPUT"

      - name: 🖥️ Prepare for CurseForge client zip creation
        shell: bash
        run: |
          mkdir temp-jar
          mv mods/realmrpg* ./temp-jar
          ./packwiz cf add realm-rpg-fallen-adventurers

      - name: 📦 Create CurseForge client zip
        shell: bash
        run: |
          ./packwiz curseforge export -o "${{steps.construct-base-name.outputs.PP3_CF_NAME}}.zip"
          ./packwiz refresh

      - name: 🧹 Clean up after CurseForge client zip creation
        shell: bash
        run: |
          ./packwiz remove realm-rpg-fallen-adventurers
          mv temp-jar/realmrpg* ./mods
          rm -r ./temp-jar

      - name: 🗃️ Prepare for server pack creation
        shell: bash
        run: |
          cat server.packwizignore >> .packwizignore
          mv serverpack/* ./

          sed -i -e "s/MINECRAFT_VERSION/${{steps.get-game-versions.outputs.MINECRAFT_VERSION}}/g" forge-auto-install.txt
          sed -i -e "s/FORGE_VERSION/${{steps.get-game-versions.outputs.FORGE_VERSION}}/g" forge-auto-install.txt

          ./packwiz refresh
          mkdir server

      - name: 📥 Download packwiz installer bootstrap
        uses: robinraju/release-downloader@v1.10
        with:
          repository: packwiz/packwiz-installer-bootstrap
          latest: true
          fileName: packwiz-installer-bootstrap.jar

      - name: 📦 Create serverpack
        shell: bash
        run: |
          cd server
          java -jar ../packwiz-installer-bootstrap.jar -g -s server ../pack.toml
          rm -f packwiz-installer.jar
          rm -f server.packwizignore
          rm -f packwiz.json
          ls -l
          cd ../

      - name: 📤 Cache mod downloads
        id: cache-mods-save
        uses: actions/cache/save@v4
        with:
          path: |
            /home/runner/.cache/packwiz/cache
            ./server/mods
          key: cached-mods-${{ hashfiles('/home/runner/.cache/packwiz/cache/**/*') }}-${{ hashfiles('./server/mods') }}

      - name: 📂 Unpack client pack for nicer artifact
        if: ${{github.event.inputs.client_artifacts}}
        shell: bash
        run: unzip "${{steps.construct-base-name.outputs.PP3_CF_NAME}}.zip" -d ./client

      - name: 📤 Upload client pack to GitHub
        if: ${{github.event.inputs.client_artifacts}}
        uses: actions/upload-artifact@v4
        with:
          name: ${{steps.construct-base-name.outputs.PP3_CF_NAME}}
          path: ./client

      - name: 📤 Upload server pack to GitHub
        if: ${{github.event.inputs.server_artifact}}
        uses: actions/upload-artifact@v4
        with:
          name: ${{steps.construct-base-name.outputs.PP3_SERVER_NAME}}
          path: ./server
